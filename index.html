<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sarauniya — A Little Universe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010106}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#blackout{position:fixed;inset:0;background:#010106;z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity 1.5s}
#blackout.off{opacity:0;pointer-events:none}
#enter{text-align:center}
#enter .line{width:80px;height:1px;background:#ff28a8;margin:0 auto 25px;box-shadow:0 0 18px #ff28a8}
#enter h1{font:300 clamp(28px,9vw,58px) Georgia,serif;letter-spacing:8px;margin:0;text-shadow:0 0 30px #ff1598}
#enter p{font-size:9px;letter-spacing:5px;color:#777;margin:18px 0 28px}
button{background:none;border:1px solid rgba(255,52,176,.7);color:#fff;border-radius:100px;padding:13px 28px;font-size:9px;letter-spacing:4px}
#top{position:fixed;top:7%;left:0;right:0;text-align:center;font-size:9px;letter-spacing:7px;color:#ffb8e5;opacity:0;transition:opacity 1s;z-index:5}
#bottom{position:fixed;bottom:7%;left:0;right:0;text-align:center;opacity:0;z-index:5;transition:opacity 2s}
#bottom strong{display:block;font:400 clamp(17px,5vw,29px) Georgia,serif;letter-spacing:3px;text-shadow:0 0 22px #ff1598}
#bottom span{display:block;margin-top:12px;font-size:8px;letter-spacing:4px;color:#999}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"></div>
<div id="bottom"><strong>For my Sarauniya ♡</strong><span>some hearts are written in code. mine was written for you.</span></div>

<div id="blackout">
  <div id="enter">
    <div class="line"></div>
    <h1>SARAUNIYA</h1>
    <p>A MESSAGE FROM MY UNIVERSE TO YOURS</p>
    <button id="go">BEGIN</button>
  </div>
</div>

<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,D=1;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();

const glyphs="01{}[]<>/\\\\=+*#@$%:;ABCDEFGHIJKLMNOPQRSTUVWXYZ♡";
const pink=["#ff1598","#ff38ad","#ff70c7","#ffa8df","#ffd9ef","#ffffff","#b60070"];
let streams=[], dust=[], bits=[], targets=[];
let active=false,stage=0,started=0;

function rnd(a,b){return a+Math.random()*(b-a)}
function makeStreams(){
 streams=[];
 for(let i=0;i<Math.ceil(W/15);i++){
  streams.push({x:i*11+rnd(-2,2),y:rnd(-H,H),v:rnd(1,4.5),n:Math.floor(rnd(5,20)),a:rnd(.08,.42)})
 }
}
makeStreams();

for(let i=0;i<220;i++) dust.push({x:Math.random()*W,y:Math.random()*H,s:rnd(.5,1.7),a:rnd(.08,.5)});

function pointsFromText(text,fs,step=5){
 const q=document.createElement('canvas'),z=q.getContext('2d');
 q.width=1000;q.height=260;
 z.font=`900 ${fs}px Arial Black,Arial,sans-serif`;
 z.textAlign='center';z.textBaseline='middle';z.fillStyle='#fff';
 z.fillText(text,500,130);
 let im=z.getImageData(0,0,q.width,q.height).data,p=[];
 for(let yy=0;yy<q.height;yy+=step)for(let xx=0;xx<q.width;xx+=step){
  if(im[(yy*q.width+xx)*4+3]>100)p.push({x:xx-500,y:yy-130});
 }
 return p;
}

/* A heart made from tiny CODE GLYPHS — no bubbles/circles. */
function heartPoints(){
 let p=[], scale=Math.min(W,H)/44;
 for(let i=0;i<900;i++){
  let t=Math.random()*Math.PI*2, r=Math.sqrt(Math.random());
  let xx=16*Math.sin(t)**3, yy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  p.push({x:xx*scale*r,y:yy*scale*r});
 }
 return p;
}

const targetCache={};
function targetsFor(name){
 if(targetCache[name]) return targetCache[name];
 let p=[];
 if(name==="YOU")p=pointsFromText("YOU",145,5);
 if(name==="ARE")p=pointsFromText("ARE",145,5);
 if(name==="MY")p=pointsFromText("MY",150,5);
 if(name==="LOVE")p=pointsFromText("LOVE",125,5);
 if(name==="SARAUNIYA")p=pointsFromText("SARAUNIYA",66,4);
 if(name==="HEART")p=heartPoints();
 targetCache[name]=p;
 return p;
}

const spriteCanvas=document.createElement('canvas');
const spriteCtx=spriteCanvas.getContext('2d');
const spriteMap=new Map();

function getSprite(ch,col,size){
 const key=ch+'|'+col+'|'+Math.round(size);
 if(spriteMap.has(key)) return spriteMap.get(key);
 const s=Math.ceil(size*2.8);
 const cv=document.createElement('canvas'); cv.width=s; cv.height=s;
 const q=cv.getContext('2d');
 q.font=`700 ${size}px monospace`;
 q.textAlign='center'; q.textBaseline='middle';
 q.fillStyle=col;
 q.fillText(ch,s/2,s/2);
 spriteMap.set(key,cv);
 return cv;
}

function createBits(){
 bits=[];
 for(let i=0;i<900;i++){
  const size=rnd(2.5,5);
  const char=glyphs[(Math.random()*glyphs.length)|0];
  const col=pink[(Math.random()*pink.length)|0];
  bits.push({
   x:rnd(-W*.1,W*1.1),y:rnd(-H*.1,H*1.1),
   tx:W/2,ty:H/2,vx:rnd(-.4,.4),vy:rnd(-.4,.4),
   size,char,col,alpha:rnd(.35,1),
   sprite:getSprite(char,col,size)
  });
 }
}

function explode(){
 for(const b of bits){
  let a=Math.random()*Math.PI*2,r=rnd(30,Math.max(W,H)*.75);
  b.x=W/2+Math.cos(a)*r;b.y=H/2+Math.sin(a)*r*.7;
 }
}

function setFormation(name){
 targets=targetsFor(name);
 if(!bits.length)createBits();
 bits.forEach((b,i)=>{
  const q=targets[i%targets.length];
  b.tx=W/2+q.x;b.ty=H/2+q.y;
  b.char=glyphs[(Math.random()*glyphs.length)|0];
 });
}

function background(t){
 x.fillStyle='#010106';x.fillRect(0,0,W,H);

 // Matrix/code rain. Tiny rectangular glyphs, never bubbles.
 x.font='8px monospace';
 for(const s of streams){
  s.y+=s.v;if(s.y>H+180)s.y=-rnd(20,300);
  for(let j=0;j<Math.min(s.n,12);j++){
   let yy=s.y-j*11;if(yy<0||yy>H)continue;
   let ch=glyphs[(Math.random()*glyphs.length)|0];
   x.fillStyle=Math.random()<.15?'rgba(255,120,210,.55)':`rgba(255,20,145,${s.a*(1-j/s.n)})`;
   x.fillText(ch,s.x,yy);
  }
 }

 for(const d of dust){
  d.y+=.05;
  if(d.y>H)d.y=0;
  x.fillStyle=`rgba(255,90,190,${d.a})`;
  x.fillRect(d.x,d.y,d.s,d.s);
 }

 // faint horizon/glow, no circular particle effects
 let g=x.createLinearGradient(0,H*.35,0,H*.72);
 g.addColorStop(0,'rgba(255,0,140,0)');
 g.addColorStop(.5,'rgba(255,0,140,.035)');
 g.addColorStop(1,'rgba(255,0,140,0)');
 x.fillStyle=g;x.fillRect(0,0,W,H);
}

function formation(t){
 for(let i=0;i<bits.length;i++){
  let b=bits[i],dx=b.tx-b.x,dy=b.ty-b.y;
  b.x+=dx*.065;b.y+=dy*.065;
  let jitter=Math.sin(t*.002+i)*.25;
  x.globalAlpha=b.alpha;
  const s=b.sprite;
  x.drawImage(s,b.x-s.width/2+jitter,b.y-s.height/2);
 }
 x.globalAlpha=1;
}

function cinematicHeart(t){
 // sweeping rings made from dashes/glyphs, inspired by the reference's spinning surface
 const cx=W/2,cy=H/2;
 x.save();x.translate(cx,cy);x.globalCompositeOperation='lighter';
 for(let ring=0;ring<5;ring++){
  let rx=Math.min(W,H)*(.13+ring*.075),ry=rx*.22;
  for(let k=0;k<42;k++){
   let a=k/80*Math.PI*2+t*.00035*(ring%2?1:-1);
   let px=Math.cos(a)*rx,py=Math.sin(a)*ry;
   x.font='6px monospace';x.fillStyle=`rgba(255,30,160,${.12-ring*.01})`;
   x.fillText(k%3===0?'0':'+',px,py);
  }
 }
 // central dark aperture
 x.fillStyle='#000';x.beginPath();x.ellipse(0,0,Math.min(W,H)*.035,Math.min(W,H)*.018,0,0,Math.PI*2);x.fill();
 x.strokeStyle='rgba(255,90,205,.8)';x.lineWidth=2;
 x.beginPath();x.ellipse(0,0,Math.min(W,H)*.045,Math.min(W,H)*.023,0,0,Math.PI*2);x.stroke();
 x.restore();
}

function finalScene(t){
 // turn the code-heart into a more graphic, elegant emblem
 cinematicHeart(t);
 x.save();x.textAlign='center';x.textBaseline='middle';
 x.font=`600 ${Math.max(14,Math.min(W,H)*.032)}px Georgia,serif`;
 x.fillStyle='#fff';
 x.fillText('I LOVE YOU, SARAUNIYA',W/2,H/2);
 x.font=`${Math.max(8,Math.min(W,H)*.014)}px Arial`;
 x.fillStyle='#ff9bd8';
 x.fillText('MY QUEEN  •  MY PEACE  •  MY HOME',W/2,H/2+29);
 x.restore();
}

const seq=[
 {name:'YOU',label:'I COULD WRITE A THOUSAND WORDS',dur:2500},
 {name:'ARE',label:'AND STILL MISS THE ONE THAT MATTERS',dur:2400},
 {name:'MY',label:'BECAUSE SOMEHOW',dur:2300},
 {name:'LOVE',label:'YOU BECAME THE WORD',dur:3300},
 {name:'HEART',label:'THAT MY HEART KEEPS DRAWING',dur:5400},
 {name:'SARAUNIYA',label:'AND THIS ONE HAS YOUR NAME',dur:4000}
];

function begin(){
 active=true;stage=0;started=performance.now();createBits();explode();
 document.getElementById('blackout').classList.add('off');
 document.getElementById('top').style.opacity='.7';
 document.getElementById('top').textContent=seq[0].label;
 setFormation(seq[0].name);
}

function loop(t){
 background(t);
 if(active){
  let elapsed=t-started;
  if(elapsed>seq[stage].dur){
   stage++;
   if(stage<seq.length){
    started=t;
    document.getElementById('top').textContent=seq[stage].label;
    setFormation(seq[stage].name);
   }else{
    document.getElementById('top').style.opacity='0';
    setFormation('HEART');
    document.getElementById('bottom').style.opacity='1';
   }
  }
  formation(t);
  if(stage>=4)cinematicHeart(t);
  if(stage>=seq.length)finalScene(t);
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('go').onclick=begin;
</script>
</body>
</html>
